appId: com.astronaut224.pi-coder
productName: Pi Coder
copyright: Copyright © 2026 Astronaut224

directories:
  output: release
  buildResources: electron/icons

files:
  - dist-electron/**/*
  - package.json
  - electron/icons/tray.png
  - electron/icons/icon.ico
  - electron/icons/tray-icon-template@2x.png
  - "!**/.DS_Store"

extraResources:
  - from: resources/server
    to: server
    filter: ["**/*"]

  - from: resources/server/node_modules
    to: server/node_modules
    filter: ["**/*"]

asarUnpack: []

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # 固定安装包包名，便于 electron-updater 自动更新匹配
  # (productName "Pi Coder" 含空格，不能用 ${productName}，否则会变成 "Pi Coder-Setup-...")
  artifactName: Pi-Coder-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

  category: public.app-category.developer-tools

  # 暂不签名
  identity: null

  # 未签名构建无需 Hardened Runtime
  hardenedRuntime: false

  # 暂不进行 Apple notarization
  notarize: false

publish:
  provider: github
  owner: Astronaut224
  repo: pi-coder