appId: com.agegr.pi-web
productName: pi-web
copyright: Copyright © 2026 agegr
directories:
  output: release
  buildResources: electron/icons
files:
  - dist-electron/**/*
  - package.json
  - electron/icons/tray.png
  - electron/icons/tray-icon-template@2x.png
  - "!**/.DS_Store"
extraResources:
  - from: resources/server
    to: server
    filter: ["**/*"]
asarUnpack: []

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/icons/entitlements.mac.plist
  entitlementsInherit: electron/icons/entitlements.mac.plist
  # electron-builder v26: notarize is a boolean. The team id is supplied via
  # the APPLE_TEAM_ID env var (+ APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD) in CI;
  # if those are absent the step is skipped gracefully (local/test builds).
  notarize: true

# Windows Authenticode 由 CI 环境变量驱动:electron-builder 默认读取
# CSC_LINK / CSC_KEY_PASSWORD(无需在此写死)。本地无证书则产出未签名包(正常)。

publish:
  provider: github
  owner: agegr
  repo: pi-web
