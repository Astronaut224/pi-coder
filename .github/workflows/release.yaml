name: Build and Release Pi Coder

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ==============================
  # Windows
  # ==============================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 例如：
      # v0.9.0 -> package.json version = 0.9.0
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Windows
        run: npm run build:desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error


  # ==============================
  # macOS
  # ==============================
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:desktop:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error


  # ==============================
  # GitHub Release
  # ==============================
  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Release files:"
          find artifacts -type f -maxdepth 2 -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --verify-tag \
            --title "Pi Coder ${GITHUB_REF_NAME}" \
            --generate-notes